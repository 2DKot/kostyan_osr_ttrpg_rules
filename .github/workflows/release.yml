name: Publish PDF

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the next version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build the PDF
        uses: ./.github/actions/build-pdf

      - name: Choose the next version
        id: version
        run: |
          major=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$major" =~ ^[0-9]+$ ]]; then
            echo "VERSION must be a whole number such as 1" >&2
            exit 1
          fi
          minor=$(git tag -l "${major}.*" | sed -n "s/^${major}\.\([0-9][0-9]*\)$/\1/p" | sort -n | tail -1)
          minor=$(( ${minor:-0} + 1 ))
          echo "tag=${major}.${minor}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" output/rules.pdf \
            --title "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --notes "Compiled from $GITHUB_SHA."
