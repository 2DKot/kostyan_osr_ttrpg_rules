name: Build PDF

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Render A4 PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the PDF
        uses: ./.github/actions/build-pdf
